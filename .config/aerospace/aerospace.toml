# ==============================================================================
# AeroSpace Configuration - Hyprland / Linux Rice Style
# Location: ~/.config/aerospace/aerospace.toml
# ==============================================================================

# Start AeroSpace at login
start-at-login = true

# Use current configuration schema
config-version = 2

# Normalizations
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Automatically start borders daemon and sketchybar on startup
after-startup-command = [
    'exec-and-forget borders',
    'exec-and-forget sketchybar',
    'exec-and-forget /Users/aakashkulkarni/.local/bin/aerospace-rice-daemon'
]

# Notify SketchyBar and enforce max-3 window tile limit on workspace change
exec-on-workspace-change = [
    '/bin/bash',
    '-c',
    '~/.local/bin/aerospace-workspace-hook'
]

# Hyprland-style Window Gaps (px)
# Calibrated for floating SketchyBar (height: 40px + y_offset: 4px = 44px)
# outer.top = 54px provides an exact 10px visual margin below the bar matching outer.bottom/left/right
[gaps]
inner.horizontal = 10
inner.vertical   = 10
outer.left       = 10
outer.bottom     = 10
outer.top        = [{ monitor."built-in" = 16 }, 54]
outer.right      = 10

# ------------------------------------------------------------------------------
# Workspace to Monitor Assignments (Built-in Retina vs LG Ultrawide)
# ------------------------------------------------------------------------------
[workspace-to-monitor-force-assignment]
1 = ["built-in", "main"]
2 = ["built-in", "main"]
3 = ["built-in", "main"]
4 = ["LG ULTRAWIDE", "secondary"]
5 = ["LG ULTRAWIDE", "secondary"]
6 = ["LG ULTRAWIDE", "secondary"]
7 = ["LG ULTRAWIDE", "secondary"]
8 = ["LG ULTRAWIDE", "secondary"]
9 = ["LG ULTRAWIDE", "secondary"]

# ------------------------------------------------------------------------------
# Keybindings - Hyprland / Vim Style
# Modifier: alt (Option key)
# ------------------------------------------------------------------------------
[mode.main.binding]

# --- Quick Terminal Launch / Focus ---
alt-t = 'exec-and-forget open -a iTerm'

# --- Dynamic Wallpaper & Color Palette Switcher ---
alt-w = 'exec-and-forget ~/.local/bin/switch-wallpaper next'

# --- Focus Navigation (Vim keys) ---
alt-h = 'focus --boundaries-action wrap-around-the-workspace left'
alt-j = 'focus --boundaries-action wrap-around-the-workspace down'
alt-k = 'focus --boundaries-action wrap-around-the-workspace up'
alt-l = 'focus --boundaries-action wrap-around-the-workspace right'

# --- Window Movement (Vim keys) ---
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# --- Window Resizing Directly with Modifiers ---
alt-left  = 'resize width -64'
alt-down  = 'resize height +64'
alt-up    = 'resize height -64'
alt-right = 'resize width +64'

# --- Layout Manipulation ---
alt-slash       = 'layout tiles horizontal vertical' # Toggle between row & column splits
alt-comma       = 'exec-and-forget ~/.local/bin/aerospace-toggle-master-horizontal' # Toggle Master-Stack <-> Horizontal
alt-period      = 'layout vertical'                  # Force all windows stacked (rows)
alt-s           = 'layout accordion horizontal vertical' # Tabbed view
alt-shift-space = 'flatten-workspace-tree'          # Reset messy nested containers back to flat layout

# --- Join operations (To build 1 Master + 2 Stacked windows easily) ---
alt-m               = 'exec-and-forget ~/.local/bin/aerospace-arrange-master-stack'
alt-backslash       = 'join-with right'
alt-minus           = 'join-with down'
alt-shift-minus     = 'join-with up'
alt-shift-backslash = 'join-with left'

# --- Balance window sizes (50/50 master stack split) ---
alt-b = 'balance-sizes'

# --- Smart Fullscreen & Floating ---
alt-f       = 'exec-and-forget ~/.local/bin/aerospace-smart-fullscreen'
alt-shift-f = 'layout floating tiling'

# --- Workspace Switching ---
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# --- Move Window to Workspace ---
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'

# --- Quick Workspace Cycling ---
alt-tab = 'workspace-back-and-forth'

# --- Reload AeroSpace Config ---
alt-shift-r = 'reload-config'

# ------------------------------------------------------------------------------
# Window Rules (Floating utility windows)
# ------------------------------------------------------------------------------
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.calculator'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.QuickTimePlayerX'
run = 'layout floating'

[[on-window-detected]]
check-further-callbacks = true
run = ['exec-and-forget /Users/aakashkulkarni/.local/bin/aerospace-enforce-max-tiles']

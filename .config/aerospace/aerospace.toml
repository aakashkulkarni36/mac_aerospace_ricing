# ==============================================================================
# AeroSpace Configuration - Hyprland / Linux Rice Style
# Location: ~/.config/aerospace/aerospace.toml
# ==============================================================================

# Start AeroSpace at login
start-at-login = true

# Use current configuration schema
config-version = 2

# Normalizations
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Automatically start borders daemon and sketchybar on startup
after-startup-command = [
    'exec-and-forget borders',
    'exec-and-forget sketchybar'
]

# Notify SketchyBar on workspace change
exec-on-workspace-change = [
    '/bin/bash',
    '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

# Hyprland-style Window Gaps (px)
# outer.top = 48 gives clean breathing room beneath the floating status bar
[gaps]
inner.horizontal = 10
inner.vertical   = 10
outer.left       = 12
outer.bottom     = 12
outer.top        = 48
outer.right      = 12

# ------------------------------------------------------------------------------
# Keybindings - Hyprland / Vim Style
# Modifier: alt (Option key)
# ------------------------------------------------------------------------------
[mode.main.binding]

# --- Focus Navigation (Vim keys) ---
alt-h = 'focus --boundaries-action wrap-around-the-workspace left'
alt-j = 'focus --boundaries-action wrap-around-the-workspace down'
alt-k = 'focus --boundaries-action wrap-around-the-workspace up'
alt-l = 'focus --boundaries-action wrap-around-the-workspace right'

# --- Window Movement (Vim keys) ---
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# --- Window Resizing Directly with Modifiers ---
alt-left  = 'resize width -64'
alt-down  = 'resize height +64'
alt-up    = 'resize height -64'
alt-right = 'resize width +64'

# --- Window Joining & Layout ---
alt-backslash = 'join-with right'
alt-minus     = 'join-with down'
alt-e         = 'layout tiles horizontal vertical' # Toggle split orientation
alt-s         = 'layout accordion horizontal vertical' # Hyprland / Sway tabbed-like view

# --- Fullscreen & Floating ---
alt-f       = 'fullscreen'
alt-shift-f = 'layout floating tiling'

# --- Workspace Switching (1-9) ---
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# --- Move Window to Workspace ---
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'

# --- Quick Workspace Cycling ---
alt-tab = 'workspace-back-and-forth'

# --- Reload AeroSpace Config ---
alt-shift-r = 'reload-config'

# ------------------------------------------------------------------------------
# Window Callbacks / Rules (Exclude utility and modal popups from tiling)
# ------------------------------------------------------------------------------
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.calculator'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.QuickTimePlayerX'
run = 'layout floating'

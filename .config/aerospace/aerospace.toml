# ==============================================================================
# AeroSpace Configuration - Hyprland / Linux Rice Style
# Location: ~/.config/aerospace/aerospace.toml
# ==============================================================================

# Start AeroSpace at login
start-at-login = true

# Normalizations
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Hyprland-style Window Gaps (px)
[gaps]
inner.horizontal = 8
inner.vertical   = 8
outer.left       = 10
outer.bottom     = 10
outer.top        = 10
outer.right      = 10

# Automatically start borders daemon (JankyBorders) if available
after-startup-command = [
    'exec-and-forget which borders && borders'
]

# ------------------------------------------------------------------------------
# Workspace Callbacks (integrates with external bars like Sketchybar)
# ------------------------------------------------------------------------------
after-login-command = []

# ------------------------------------------------------------------------------
# Keybindings - Hyprland / Vim Style
# Modifier: alt (Option key)
# ------------------------------------------------------------------------------
[mode.main.binding]

# --- Focus Navigation (Vim keys) ---
alt-h = 'focus --boundaries-action wrap-around-the-workspace left'
alt-j = 'focus --boundaries-action wrap-around-the-workspace down'
alt-k = 'focus --boundaries-action wrap-around-the-workspace up'
alt-l = 'focus --boundaries-action wrap-around-the-workspace right'

# --- Window Movement (Vim keys) ---
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# --- Window Splitting & Layout ---
alt-backslash = 'split horizontal'
alt-minus     = 'split vertical'
alt-e         = 'layout tiles horizontal vertical' # Toggle split orientation
alt-s         = 'layout accordion horizontal vertical' # Hyprland / Sway tabbed-like view

# --- Fullscreen & Floating ---
alt-f       = 'fullscreen'
alt-shift-f = 'layout floating tiling'

# --- Workspace Switching (1-9, 0) ---
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# --- Move Window to Workspace ---
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'

# --- Quick Workspace Cycling ---
alt-tab = 'workspace-back-and-forth'

# --- Resize Submode (Hyprland / i3 style) ---
alt-r = 'mode resize'

# --- Reload AeroSpace Config ---
alt-shift-r = 'reload-config'

# ------------------------------------------------------------------------------
# Resize Mode
# ------------------------------------------------------------------------------
[mode.resize.binding]
h = 'resize width -64'
j = 'resize height +64'
k = 'resize height -64'
l = 'resize width +64'
enter = 'mode main'
esc = 'mode main'

# ------------------------------------------------------------------------------
# Window Callbacks / Rules (Exclude utility and modal popups from tiling)
# ------------------------------------------------------------------------------
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.calculator'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.QuickTimePlayerX'
run = 'layout floating'
